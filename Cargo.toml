[workspace]
members = [
    "crates/openclaw-core",
    "crates/openclaw-cli",
    "crates/openclaw-gateway",
    "crates/openclaw-ffi",
]
resolver = "2"

[workspace.package]
version = "2026.1.29"
edition = "2021"
rust-version = "1.77"
authors = ["OpenClaw Contributors"]
license = "MIT"
repository = "https://github.com/openclaw/openclaw"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime
async-trait = "0.1"

# HTTP/WebSocket
axum = { version = "0.7", features = ["ws"] }
hyper = "1.0"
tower = "0.4"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Configuration
config = "0.14"
toml = "0.8"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
